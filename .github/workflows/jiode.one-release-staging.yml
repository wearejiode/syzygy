# .github/workflows/jiode.one-release-staging.yml
name: Jiode.one Release to Staging

on:
  push:
    branches: [main]
    paths:
      - 'apps/core/jiode/jiode.one/**'

jobs:
  staging:
    # Calls the reusable worker CI workflow
    uses: wearejiode/syzygy/.github/workflows/_worker-ci.yml@main
    secrets:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      worker_name: jiode-one-staging
      preview_host: staging.jiode.workers.dev
      environment: staging
      app_id: jiode.one
      app_path: apps/core/jiode/jiode.one
      wrangler_config: apps/core/jiode/jiode.one/wrangler.staging.toml
      deploy: true

  post_sync:
    needs: staging
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PREVIEW }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PREVIEW }}
    steps:
      - uses: actions/checkout@v4
      - name: Push static assets to R2 (staging)
        uses: ./.github/actions/sesame/r2-push
        with:
          bucket: jiode-one-data-staging
          public_dir: apps/core/jiode/jiode.one/public
          # If you have a metadata/data.json for jiode.one, include it:
          # data_json_path: apps/core/jiode/jiode.one/data.json
          wrangler_config: apps/core/jiode/jiode.one/wrangler.staging.toml
          wrangler_version: '4.33.0'
