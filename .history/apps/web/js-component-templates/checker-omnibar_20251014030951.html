<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- *asdf  */ -->
  <style>
        :root{
    --bg:#0B0B10;
    --glass:rgba(255,255,255,.08);
    --glass2:rgba(75, 217, 239, 0.5);
    --checker-dark: rgba(0,0,0,0.6);  /* 80% black */
    --checker-light: hsla(0, 0%, 100%, 0.7); /* 20% white */
    --checker-size: 40px;              /* tile size */
    --checker-size: none;              /* toggle the .checker background size for a cool effect */
    --border-radius-omnibar-outer: 10px;
    --shadow: 0 2px 5px rgba(0,0,0,0.2);
    --omnibar-background-opacity: .5;
    --capsule-bar-height: 50px;
    --omnibar-dropdown-height: 50vh;
    --omnibar-top-level-height: 120px;
    }
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      height: 300vh;
      overflow-y: scroll;
    }
/* #region backdrops */
    .backdrop {
      position: relative;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
      z-index: 0;
    }

    .backdrop2 {
      position: relative;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: linear-gradient(80deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
      z-index: 0;
    }
    .backdrop3 {
      position: relative;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: linear-gradient(80deg, #202020, #205080);
      z-index: 0;
    }
  /* #endregion backdrops */

    .omnibar-top-level {
      position: fixed;
      top: 2rem;
      right: 0;
      left: 0;
      display: grid;
      grid-template-columns: 2fr 16fr;
      grid-template-rows: 1fr;
      gap: .5rem;
      width: 80vw;
      height: var(--omnibar-top-level-height);
      align-items: center;
      justify-content: space-around;
      margin: auto;
      color: white;
      text-align: center;
      z-index: 100;
    }

    /* #region ombibar-logo */

    .omnibar-logo {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      grid-column: 1 / span 1;
      height: 100%;
      width: 100%;
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      /* border-right: 5px solid yellow; */
      opacity: 100%;
      z-index: 2;
      border-radius: var(--border-radius-omnibar-outer);
      overflow: hidden;
    }

    .omnibar-logo-content {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      width: 100% ;
      font-size: 2.5rem;
      font-weight: bold;
      color: #fff;
      opacity: 50%;
    }

    .omnibar-logo-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: var(--omnibar-background-opacity);
      z-index: -1;
      box-shadow: var(--shadow);
    }

    .omnibar-logo-background-2 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: var(--omnibar-background-opacity);
      z-index: -1;
      background-image: linear-gradient(80deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
    }

    /* #endregion omnibar-logo */

    /* #region checkers */
    .checkers {
      background-image:
      linear-gradient(45deg, var(--checker-dark) 25%, var(--checker-light) 25%),
      linear-gradient(-45deg, var(--checker-dark) 25%, var(--checker-light) 25%),
      linear-gradient(45deg, var(--checker-light) 75%, var(--checker-dark) 75%),
      linear-gradient(-45deg, var(--checker-light) 75%, var(--checker-dark) 75%);

    /* 4-layer checkerboard on top, animated conic gradient behind */
    background-size:
      var(--checker-size) var(--checker-size),
      var(--checker-size) var(--checker-size),
      var(--checker-size) var(--checker-size),
      var(--checker-size) var(--checker-size),
      0% 0%; /* start tiny, grow to fill */
    background-position:
      0 0,
      0 calc(var(--checker-size)/2),
      calc(var(--checker-size)/2) calc(-1 * var(--checker-size)/2),
      calc(-1 * var(--checker-size)/2) 0,
      center;
    background-repeat:
      repeat,
      repeat,
      repeat,
      repeat,
      no-repeat;
    overflow:hidden;
    border-radius: var(--border-radius-omnibar-outer);

    position: absolute;
    }
    /* #endregion checkers */

    .omnibar-wrapper-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* backdrop-filter: blur(10px); */
      border-radius: var(--border-radius-omnibar-outer);
      box-shadow: var(--shadow);
      opacity: var(--omnibar-background-opacity);
      z-index: 0;
      /* background-image: linear-gradient(80deg, #ff00ff, #00ffff, #ffff00, #ff00ff); */

    }

    .omnibar-wrapper-background-2 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      /* backdrop-filter: blur(10px); */
      border-radius: var(--border-radius-omnibar-outer);
      box-shadow: var(--shadow);
      opacity: var(--omnibar-background-opacity);
      z-index: 0;
      background-image: linear-gradient(80deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
    }

    .omnibar-wrapper {
      display: grid;
      grid-template-columns: 8fr 1fr 1fr;
      grid-template-rows: 0px 5px 1fr 1fr;
      grid-template-areas:
      '. . canvas2'
      'canvas canvas canvas'
      'input input menu'
      'capsule-bar capsule-bar .'
                           ;
      grid-column: 2/ span 1;
      justify-self: center;
      width: 100%;
      height: 100%;
      backdrop-filter: blur(10px);
      /* background-color: #fff; */
      color: white;
      align-items: center;
      justify-content: space-between;
      opacity: 90%;
      padding: .5rem;
    }

/* #region omnibar-input */
    .omnibar-input-wrapper {
      grid-area: input;
      height: 100%;
      flex: 1;
      margin-right: 20px;
      z-index: 3;
    }
    .omnibar-input {
      position: relative;
      top: 0;
      width: 100%;
      height: 100%;
      padding: 10px;
      border-radius:  0 var(--border-radius-omnibar-outer)  var(--border-radius-omnibar-outer) var(--border-radius-omnibar-outer);
      box-sizing: border-box;
      font-size:1.2rem;
      /* padding:0.5rem; */
      border:none;
       /* opacity: .9; */
      appearance: none;;
       /* background-color: linear-gradient(90deg, #ffffffaa, #ffffff00); */
       resize: none;
    }

  /* #endregion omnibar-input */

  /* #region capsule-bar */
    .omnibar-capsule-bar {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: start;
      grid-area: capsule-bar;
      gap: 15px;
      z-index: 2;
      width: 100%;
      padding-left: 1.5rem;
      height: var(--capsule-bar-height, 50px);
      /* background-color: #00ffff33; */
    }

    .omnibar-capsule {
      display: flex;
      width: 2rem;
      height: 2rem;
      border-radius: 50%;
      background-color: #00000022;
      border: 1px solid var(--glass);
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: 1s;
      overflow: clip;
      /* text-overflow: clip; */
      color: white;
      font-weight: bold;
      align-items: center;
      backdrop-filter: saturate(100%);
      opacity: 200%;
      isolation: isolate;
    }

    /* Maybe make the omnibar capsules bigger, then use some kind of javascript to expand them in sequence on hover of the whole bar? Or in sequence to show the user they can be interacted with when other parts of the bar are hovered, and advertise the options. Could be really cool to do a ripple effect of sorts. */
    .omnibar-capsule {
      width: 10rem;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      padding: 0 1rem;
    }

    .omnibar-capsule:hover {
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
      transform: scale(1.05);
            background-color: #00000055;
      transition: 0.3s;
      cursor: pointer;
    }

/* #endregion capsule-bar */

/* #region omnibar-menu */

    .omnibar-menu {
      position: relative;
      grid-area: menu;
      background-color: var(--glass);
      border: 1px solid #ffffff22;
      color: white;
      padding: 10px;
      cursor: pointer;
      border-radius: var(--border-radius-omnibar-outer) var(--border-radius-omnibar-outer) ;
      font-size: 1.25rem;
      font-weight: bold;
      z-index: 2;
      text-wrap: no-wrap;
    }


    .omnibar-menu:hover {
      background-color: #00000022;
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
      transform: scale(1.05);
      transition: 0.3s;
      cursor: pointer;
    }

/* #endregion omnibar-menu */

/* #region drowpdown */
    .omnibar-dropdown-top-wrapper {
      position: absolute;
      display: flex; /* Hidden by default */
      /* display: none; */
      grid-area: canvas;
      align-content: center;
      justify-content: space-between;
      /* background-image: linear-gradient(80deg, #ff00ff, #00ffff); */
      /* box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); */
      z-index: 1;
      height: 100%;
      width: 100%;
      border: none;
      opacity: 90%;
      transform: translateY(-5px);
    }

/* #region canvas-left */
    .omnibar-dropdown-canvas-left {
      position: relative;
      display: grid; /* Hidden by default */
      /* display: none; */
      grid-template-rows: var(--capsule-bar-height, 50px) auto;
      grid-template-areas:
      'spacer'
      'canvas-left-content-cards'
      ;
      align-content: space-between;
      justify-content: space-between;
      background-image: linear-gradient(80deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 100;
      height: 100%;
      width: 0%;
      border: none;
      opacity: 90%;
      transform: translateX(-5px);
      transition: width 0.5s ease-in-out, height .1s ease-in-out;
      mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
    }

    .omnibar-dropdown-canvas-left-open {
      width: 100%;
      height: var(--omnibar-dropdown-height)
    }

    /* <div class="omnibar-dropdown-background-left  checkers"></div>
        <div class="omnibar-dropdown-items-left">
          <div class="omnibar-dropdown-item-left">
            <div class="omnibar-dropdown-icon-left"></div>
            <div class="omnibar-dropdown-info-left"></div>
            <div class="omnibar-dropdown-link-left"></div>
          </div> */


    .omnibar-dropdown-items-left {
      grid-area: canvas-left-content-cards;
      display: grid;
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      height: 100px;
      width: 100%;
      height: 100%;
      /* height: var(--omnibar-dropdown-height); */
      background-image: linear-gradient(#ffffff99, #ffffffff);
      /* margin: 1rem; */
      margin-top: var(--omnibar-top-level-height);
      border-radius: var(--border-radius-omnibar-outer);
      border-radius: 5rem ;
    }

/*  #endregion canvas-left */

/* #region canvas-right */
    .omnibar-dropdown-canvas-right {
      position: relative;
      display: grid; /* Hidden by default */
      /* display: none; */
      grid-area: canvas2;
      grid-template-rows: var(--capsule-bar-height, 50px) 1fr;
      grid-template-areas:
      'spacer'
      'canvas-right-content-cards'
      ;
      align-content: space-between;
      /* background-image: linear-gradient(80deg, #ff00ff, #00ffff, #ffff00, #ff00ff); */
      background-image:
      linear-gradient(80deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
      z-index: 100;
      height: 100%;
      width: 0%;
      border: none;
      opacity: 90%;
      /* filter: grayscale(80%); */
      /* transform: translateX(100%); */
      transform: translateX(5px);
      transition: width 0.5s ease-in-out , height .1s ease-in-out;
      mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      /* transition-delay: 1s; */
    }

    .omnibar-dropdown-canvas-right-open {
      width: 100%;
      height: var(--omnibar-dropdown-height);
    }

    .omnibar-dropdown-slider-wrapper {
      grid-area: content;
      position: relative;
      display: grid;
      flex-wrap: wrap;
      align-items: center;
      height: 50px;
      width: 50%;
      background-color: #ffffff22;
      border-radius: 5px;
      margin: 10px auto;
    }

/* #endregion canvas-right */

  .omnibar-dropdown-items-accent{
      position: relative;
      display: grid;
      grid-area: content;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: auto auto auto;
      gap: 10px;
      padding: 10px;
      overflow-y: auto;
      height: calc(100% - var(--capsule-bar-height, 50px));
      background-color: #ffffff11;
    }


    /* Cool CSS trick: */
    /* Make s temporary "open class" for any items you want to be expanded */
    .open-tmp {
      width: 100%;
      height: 50vh;
    }


  </style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="backdrop2"></div>
  <div class="backdrop3"></div>
  <div class="omnibar-top-level">
    <div class="omnibar-logo">
            <div class="omnibar-logo-content">Logo</div>
      <div class="omnibar-logo-background  checkers"></div>
      <div class="omnibar-logo-background-2"></div>
    </div>
    <div class="omnibar-wrapper">
      <div class="omnibar-wrapper-background  checkers"></div>
      <div class="omnibar-wrapper-background-2"></div>
      <div class="omnibar-input-wrapper">
        <!-- A classical "search" input box that takes user questions or keywords. -->
        <textarea rows="1" class="omnibar-input" placeholder="Search..."></textarea>
      </div>
      <!-- <A classic dropdown menu for navigation. -->
      <button class="omnibar-menu">Menu</button>
      <div class="omnibar-capsule-bar">
        <!-- Kind of like a tags based navigation (helps to infrom the agent) -->
        <div class="omnibar-capsule">Products</div>
        <div class="omnibar-capsule">Founders</div>
        <div class="omnibar-capsule">Information</div>
      </div>
      <div class="omnibar-dropdown-top-wrapper">
      <div class="omnibar-dropdown-canvas-left open-tmp">
        <div class="omnibar-dropdown-background-left  checkers"></div>
        <div class="omnibar-dropdown-items-left open-tmp">
          <div class="omnibar-dropdown-item-left">
            <div class="omnibar-dropdown-icon-left"></div>
            <div class="omnibar-dropdown-info-left"></div>
            <div class="omnibar-dropdown-link-left"></div>
          </div>
          <div class="omnibar-dropdown-item-left">
            <div class="omnibar-dropdown-icon-left"></div>
            <div class="omnibar-dropdown-info-left"></div>
            <div class="omnibar-dropdown-link-left"></div>
          </div>
          <div class="omnibar-dropdown-item-left">
            <div class="omnibar-dropdown-icon-left"></div>
            <div class="omnibar-dropdown-info-left"></div>
            <div class="omnibar-dropdown-link-left"></div>
          </div>
        </div>
      </div>
      <div class="omnibar-dropdown-canvas-right">
        <div class="omnibar-dropdown-background  checkers"></div>
        <div class="omnibar-dropdown-slider-wrapper">
          <label class="omnibar-dropdown-slider-label" for="dropdown-menu-slider-transparency">Transparency</label>
          <input class="omnibar-dropdown-slider-transparency" type="range" id="dropdown-menu-slider-transparency" name="volume" min="70" max="100" value="70">
        </div>
        <div class="omnibar-dropdown-items">
          <div class="omnibar-dropdown-item">
            <div class="omnibar-dropdown-icon"></div>
            <div class="omnibar-dropdown-info"></div>
            <div class="omnibar-dropdown-link"></div>
          </div>
          <div class="omnibar-dropdown-item">
            <div class="omnibar-dropdown-icon"></div>
            <div class="omnibar-dropdown-info"></div>
            <div class="omnibar-dropdown-link"></div>
          </div>
          <div class="omnibar-dropdown-item">
            <div class="omnibar-dropdown-icon"></div>
            <div class="omnibar-dropdown-info"></div>
            <div class="omnibar-dropdown-link"></div>
          </div>
        </div>
      </div>
      </div>
    </div>
  </div>
  <script>
// Debounce with a .cancel() helper
function debounce(fn, delay) {
  let t;
  const d = function (...args) {
    clearTimeout(t);
    const ctx = this;
    t = setTimeout(() => fn.apply(ctx, args), delay);
  };
  d.cancel = () => clearTimeout(t);
  return d;
}

// Elements
const omniMenuButton = document.querySelector('.omnibar-menu');
const dropdownRight  = document.querySelector('.omnibar-dropdown-canvas-right');
const dropdownLeft   = document.querySelector('.omnibar-dropdown-canvas-left');
const omniCapsuleButtons = document.querySelectorAll('.omnibar-capsule');

// Right dropdown toggle (unchanged)
if (omniMenuButton && dropdownRight) {
  omniMenuButton.addEventListener('click', () => {
    dropdownRight.classList.toggle('omnibar-dropdown-canvas-right-open');
  });
}

// Left dropdown: keep-open-on-hover logic
if (dropdownLeft && omniCapsuleButtons.length) {
  const OPEN_CLASS_LEFT = 'omnibar-dropdown-canvas-left-open';
  const OPEN_CLASS_RIGHT = 'omnibar-dropdown-canvas-right-open';

  const openMenu    = () => dropdownLeft.classList.add(OPEN_CLASS_LEFT);
  const closeMenu   = () => dropdownLeft.classList.remove(OPEN_CLASS_LEFT);
  const closeMenu2   = () => dropdownRight.classList.remove(OPEN_CLASS_RIGHT);
  const scheduleClose = debounce(closeMenu, 500);
  const cancelClose   = () => scheduleClose.cancel();

  // Hovering capsules should open and cancel any pending close
  omniCapsuleButtons.forEach((btn) => {
    btn.addEventListener('pointerenter', () => {
      cancelClose();
      openMenu();
    });
    btn.addEventListener('pointerleave', () => {
      scheduleClose(); // will close after 500ms unless canceled
    });
  });

  // ALSO keep it open when moving into the dropdown itself
  dropdownLeft.addEventListener('pointerenter', cancelClose);
  dropdownLeft.addEventListener('pointerleave', scheduleClose);

  dropdownLeft.addEventListener('pointerenter', closeMenu2);

  // Optional: close on Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMenu();
  });
} else {
  console.log('Capsules or left dropdown not found.');
}

  const opacitySlider = document.getElementById('dropdown-menu-slider-transparency')
  const root = document.documentElement;
  console.log(opacitySlider)
  opacitySlider.addEventListener('mouseup',
    ()=> {
      dropdownRight.style.opacity = `${opacitySlider.value}%`;
      root.style.setProperty('--omnibar-background-opacity', `${opacitySlider.value}%`); ;
      // console.log(1)
    }
  )


  </script>
</body>
</html>
