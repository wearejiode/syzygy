<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
        :root{
    --bg:#0B0B10;
    --glass:rgba(255,255,255,.08);
    --glass2:rgba(39, 109, 120, 0.58);
    --checker-dark: rgba(0,0,0,0.50);  /* 80% black */
    --checker-light: rgba(255,255,255,0.5); /* 20% white */
    --checker-size: 40px;              /* tile size */
    --border-radius-omnibar-outer: 10px;
    }
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    .backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(45deg, #ff00ff, #00ffff, #ffff00, #ff00ff);
      z-index: 0;
    }

    .omnibar-wrapper {
      position: fixed;
      display: grid;
      grid-template-columns: 1fr 8fr 1fr;
      grid-template-rows: 2fr 1fr;
      justify-self: center;
      top: 2rem;
      right: 0;
      left: 0;
      width: 80vw;
      height: 100px;
      backdrop-filter: blur(10px);
      /* background-color: #fff; */
      color: white;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 500;
      background-image:
      linear-gradient(45deg, var(--checker-dark) 25%, var(--checker-light) 25%),
      linear-gradient(-45deg, var(--checker-dark) 25%, var(--checker-light) 25%),
      linear-gradient(45deg, var(--checker-light) 75%, var(--checker-dark) 75%),
      linear-gradient(-45deg, var(--checker-light) 75%, var(--checker-dark) 75%);

    /* 4-layer checkerboard on top, animated conic gradient behind */
    background-size:
      var(--checker-size) var(--checker-size),
      var(--checker-size) var(--checker-size),
      var(--checker-size) var(--checker-size),
      var(--checker-size) var(--checker-size),
      0% 0%; /* start tiny, grow to fill */
    background-position:
      0 0,
      0 calc(var(--checker-size)/2),
      calc(var(--checker-size)/2) calc(-1 * var(--checker-size)/2),
      calc(-1 * var(--checker-size)/2) 0,
      center;
    background-repeat:
      repeat,
      repeat,
      repeat,
      repeat,
      no-repeat;
    overflow:hidden;
    border-radius: var(--border-radius-omnibar-outer);

    }

    .omnibar-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      grid-column: 1 / span 1;
      grid-row: 1 / span 2;
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      border-right: 5px solid yellow;
      background-color: #ffffff77;
    }
    .omnibar-input-wrapper {
      grid-column: 2 / span 1;
      grid-row: 1 / span 1;
      height: 100%;
      flex: 1;
      margin: 0 20px;
    }
    .omnibar-input {
      position: relative;
      top: 0;
      width: 100%;
      height: 100%;
      padding: 10px;
      border-radius: 5px;
      box-sizing: border-box;
      font-size:1.2rem;
      padding:0.5rem;
       border:none;
    }

    .omnibar-dropdown {
      position: relative;
      display: inline-block;
    }

    .omnibar-current {
      grid-column: 3 / span 1;
      grid-row: 2 / span 1;
      background-color: #444;
      border: none;
      color: white;
      padding: 10px;
      cursor: pointer;
      border-radius: var(--border-radius-omnibar-outer) 0 0 0 ;
      font-size: 100%;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <div class="omnibar-wrapper">
    <div class="omnibar-logo">Logo</div>
    <div class="omnibar-input-wrapper">
      <textarea rows="1" class="omnibar-input" placeholder="Search..."></textarea>
    </div>
    <button class="omnibar-current">Menu ▼</button>
  </div>

</body>
</html>
